<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud Runner</title>
<style>
:root {
  --bg:     #0d1117;
  --s1:     #161b22;
  --s2:     #1c2128;
  --s3:     #21262d;
  --border: #30363d;
  --text:   #e6edf3;
  --text2:  #7d8590;
  --text3:  #484f58;
  --accent: #2f81f7;
  --green:  #3fb950;
  --red:    #f85149;
  --sidebar: 220px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; }

.hdr { height: 52px; background: var(--s1); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 18px; gap: 10px; flex-shrink: 0; }
.hdr-logo { font-size: 18px; }
.hdr-title { font-weight: 700; font-size: 15px; }
.hdr-tag { font-size: 10px; font-weight: 700; letter-spacing: .5px; padding: 3px 9px; border-radius: 20px; background: var(--accent); color: #fff; }
.hdr-clock { margin-left: auto; font-size: 12px; color: var(--text2); font-family: monospace; font-variant-numeric: tabular-nums; }

.app { display: flex; flex: 1; overflow: hidden; min-width: 0; }

/* Sidebar */
.sidebar { width: var(--sidebar); background: var(--s1); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
.sidebar-lbl { padding: 16px 16px 8px; font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .8px; }
.sb-jobs { flex: 1; overflow-y: auto; }
.sb-footer { padding: 10px 8px; border-top: 1px solid var(--border); }

.job-item { margin: 2px 8px; padding: 10px 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; transition: background .12s; }
.job-item:hover { background: var(--s2); }
.job-item.active { background: var(--s2); border-color: var(--border); }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot.idle    { background: var(--s3); }
.dot.running { background: var(--accent); animation: blink 1.1s ease-in-out infinite; }
.dot.success { background: var(--green); }
.dot.error   { background: var(--red); }
@keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.5)} }
.job-item-info { flex: 1; overflow: hidden; }
.job-item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.job-item-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }

.btn-new { width: 100%; padding: 9px; border-radius: 8px; background: transparent; border: 1px dashed var(--border); color: var(--text2); font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
.btn-new:hover { border-color: var(--accent); color: var(--accent); background: #1f6feb0f; }
.btn-new.active { border-color: var(--accent); color: var(--accent); background: #1f6feb0f; }

/* Main */
.main { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 22px; display: flex; flex-direction: column; gap: 0; }
.card { width: 100%; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; flex: 1; }
@media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }

/* Sticky execution panel */
.exec-col  { position: sticky; top: 0; align-self: start; height: calc(100vh - 96px); display: flex; flex-direction: column; }
.exec-card { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.exec-body { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.exec-log  { flex: 1; height: 0 !important; min-height: 80px; overflow-y: auto !important; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }

/* Inline edit */
.btn-edit { background: transparent; border: 1px solid transparent; color: var(--text3); cursor: pointer; font-size: 13px; padding: 3px 7px; border-radius: 6px; transition: all .15s; line-height: 1; }
.btn-edit:hover { color: var(--text); border-color: var(--border); background: var(--s2); }
.edit-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1; }
.edit-inp { background: var(--s3); border: 1px solid var(--accent); color: var(--text); padding: 5px 10px; border-radius: 6px; font-size: 14px; font-weight: 600; outline: none; font-family: inherit; width: 100%; }
.edit-inp.sm { font-size: 12px; font-weight: 400; color: var(--text2); }
.edit-inp:focus { border-color: #58a6ff; }

/* Cards */
.card { background: var(--s1); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.card-hdr { padding: 12px 18px; border-bottom: 1px solid var(--s3); display: flex; align-items: center; }
.card-title { font-size: 11px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .7px; flex: 1; }
.card-body { padding: 18px; }

/* Status card */
.job-top { display: flex; align-items: flex-start; gap: 14px; }
.job-top-info { flex: 1; }
.job-big-name { font-size: 18px; font-weight: 700; }
.job-big-desc { font-size: 13px; color: var(--text2); margin-top: 4px; }
.status-pill { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; border: 1px solid; white-space: nowrap; }
.status-pill.idle    { background: var(--s3); border-color: var(--border); color: var(--text2); }
.status-pill.running { background: #1f6feb14; border-color: #1f6feb55; color: var(--accent); }
.status-pill.success { background: #2ea04314; border-color: #2ea04355; color: var(--green); }
.status-pill.error   { background: #da363314; border-color: #da363355; color: var(--red); }
.meta-row { display: flex; gap: 20px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.meta-item { font-size: 12px; color: var(--text2); }
.meta-item strong { color: var(--text); font-weight: 500; }

/* Danger zone */
.danger-row { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--s3); }
.btn-danger { padding: 6px 14px; border-radius: 6px; background: transparent; border: 1px solid #da363355; color: var(--red); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
.btn-danger:hover { background: #da363314; border-color: var(--red); }

/* ── Schedule visual ────────────────────────────────────────────── */
.section-lbl { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 10px; }
.day-picker { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
.day-btn { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--border); background: var(--s2); color: var(--text2); font-size: 13px; font-weight: 700; cursor: pointer; transition: all .15s; display: flex; align-items: center; justify-content: center; }
.day-btn:hover { border-color: var(--green); color: var(--green); }
.day-btn.on { background: #2ea04322; border-color: var(--green); color: var(--green); }
.day-quick { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.day-quick-btn { font-size: 12px; color: var(--accent); cursor: pointer; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; opacity: .8; }
.day-quick-btn:hover { opacity: 1; }
.time-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; min-height: 36px; align-items: center; }
.time-tag { display: flex; align-items: center; gap: 6px; background: #1f6feb18; border: 1px solid #1f6feb44; border-radius: 20px; padding: 5px 12px 5px 14px; font-size: 14px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.time-tag-remove { font-size: 16px; color: var(--text2); cursor: pointer; line-height: 1; }
.time-tag-remove:hover { color: var(--red); }
.time-tags-empty { font-size: 13px; color: var(--text3); font-style: italic; }
.time-add-row { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
.time-input { background: var(--s2); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; font-size: 14px; font-weight: 600; outline: none; width: 130px; transition: border-color .15s; }
.time-input:focus { border-color: var(--accent); }
.sched-summary { background: var(--s2); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: var(--text2); margin-bottom: 16px; line-height: 1.5; }
.sched-summary strong { color: var(--text); }
.sched-summary .next-run { font-size: 12px; margin-top: 4px; color: var(--accent); }
.switch { position: relative; width: 40px; height: 22px; cursor: pointer; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch-track { position: absolute; inset: 0; background: var(--s3); border-radius: 22px; transition: background .2s; }
.switch input:checked + .switch-track { background: var(--accent); }
.switch-thumb { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: #fff; border-radius: 50%; transition: left .2s; pointer-events: none; }
.switch input:checked ~ .switch-thumb { left: 21px; }
.switch-lbl { font-size: 13px; color: var(--text2); cursor: pointer; user-select: none; }
.manual-toggle { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.cron-detail { margin-top: 12px; }
.cron-detail summary { font-size: 11px; color: var(--text3); cursor: pointer; user-select: none; }
.cron-detail summary:hover { color: var(--text2); }
.cron-code { font-family: monospace; font-size: 12px; color: var(--text2); background: var(--s3); border-radius: 4px; padding: 4px 8px; margin-top: 6px; display: inline-block; }

/* Buttons */
.btn-row { display: flex; align-items: center; gap: 10px; }
.btn { padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid; transition: filter .12s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { filter: brightness(1.15); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-green   { background: #238636; border-color: #2ea043; color: #fff; }
.btn-ghost   { background: transparent; border-color: var(--border); color: var(--text2); }
.save-msg { font-size: 12px; color: var(--text2); }

/* Execution */
.exec-top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.exec-timer { font-family: monospace; font-size: 13px; font-weight: 600; color: var(--accent); background: #1f6feb14; border: 1px solid #1f6feb33; padding: 3px 10px; border-radius: 20px; display: none; }
.exec-timer.visible { display: inline-block; }
.exec-status { font-size: 12px; color: var(--text2); }
.history-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.history-hdr .section-lbl { margin-bottom: 0; }
.btn-clear-err { font-size: 11px; color: var(--text2); background: transparent; border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; cursor: pointer; transition: all .15s; }
.btn-clear-err:hover { color: var(--red); border-color: var(--red); }
.history-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; max-height: 180px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; flex-shrink: 0; }
.history-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: var(--s2); border-radius: 6px; font-size: 12px; transition: background .12s; }
.history-row:hover { background: var(--s3); }
.history-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.history-dot.success { background: var(--green); }
.history-dot.error   { background: var(--red); }
.h-time { color: var(--text2); flex-shrink: 0; width: 110px; }
.h-result { flex: 1; }
.h-dur { color: var(--text3); font-family: monospace; flex-shrink: 0; margin-right: 4px; }
.h-del { font-size: 15px; color: var(--text3); cursor: pointer; line-height: 1; flex-shrink: 0; opacity: 0; transition: opacity .15s, color .15s; }
.history-row:hover .h-del { opacity: 1; }
.h-del:hover { color: var(--red); }
.history-empty { font-size: 12px; color: var(--text3); font-style: italic; margin-bottom: 12px; }
.log-box { background: #010409; border: 1px solid var(--s3); border-radius: 7px; height: 240px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.log-box pre { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 12px; line-height: 1.75; color: #c9d1d9; padding: 12px 14px; white-space: pre-wrap; word-break: break-all; }
.log-ph { color: var(--text3) !important; font-style: italic; }

/* Create form */
.form-field { margin-bottom: 16px; }
.form-lbl { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; display: block; }
.form-input { width: 100%; background: var(--s2); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 6px; font-size: 14px; outline: none; transition: border-color .15s; font-family: inherit; }
.form-input:focus { border-color: var(--accent); }
textarea.form-input { min-height: 60px; resize: vertical; }
.file-drop { border: 2px dashed var(--border); border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: all .15s; background: var(--s2); }
.file-drop:hover, .file-drop.over { border-color: var(--accent); background: #1f6feb0a; }
.file-drop input { display: none; }
.file-drop-text { font-size: 13px; color: var(--text2); }
.file-drop-name { font-size: 14px; font-weight: 700; color: var(--green); margin-top: 6px; }
.file-types { font-size: 11px; color: var(--text3); margin-top: 4px; }
.divider { border: none; border-top: 1px solid var(--s3); margin: 20px 0; }

/* Notifications */
.notify-section { margin-bottom: 18px; padding-top: 16px; border-top: 1px solid var(--s3); }
.notify-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.notify-pill { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--s2); color: var(--text2); font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; }
.notify-pill:hover { border-color: var(--accent); color: var(--accent); }
.notify-pill.on-never   { }
.notify-pill.on-failure { }
.notify-pill.on-success { }
.notify-pill.on-always  { }
.notify-pill.active-never   { background: var(--s3); border-color: var(--border); color: var(--text2); }
.notify-pill.active-failure { background: #da363314; border-color: #da363355; color: var(--red); }
.notify-pill.active-success { background: #2ea04314; border-color: #2ea04355; color: var(--green); }
.notify-pill.active-always  { background: #1f6feb14; border-color: #1f6feb55; color: var(--accent); }
.notify-email-row { display: flex; gap: 8px; align-items: center; }
.notify-email-inp { flex: 1; background: var(--s2); border: 1px solid var(--border); color: var(--text); padding: 7px 11px; border-radius: 6px; font-size: 13px; outline: none; transition: border-color .15s; font-family: inherit; }
.notify-email-inp:focus { border-color: var(--accent); }

/* Modal confirm */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal { background: var(--s1); border: 1px solid var(--border); border-radius: 12px; padding: 24px; max-width: 360px; width: 90%; }
.modal h3 { font-size: 16px; margin-bottom: 8px; }
.modal p { font-size: 13px; color: var(--text2); margin-bottom: 20px; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; }

/* Toast */
#toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 999; pointer-events: none; }
.toast { background: var(--s1); border: 1px solid var(--border); border-radius: 8px; padding: 10px 15px; font-size: 13px; display: flex; align-items: center; gap: 8px; animation: tin .2s ease; pointer-events: all; }
.toast.ok  { border-color: #2ea04355; }
.toast.err { border-color: #da363355; }
@keyframes tin { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
</style>
</head>
<body>

<header class="hdr">
  <span class="hdr-logo">☁️</span>
  <span class="hdr-title">Cloud Runner</span>
  <span class="hdr-tag">PRO</span>
  <span class="hdr-clock" id="clock">--:--:--</span>
</header>

<div class="app">
  <nav class="sidebar">
    <div class="sidebar-lbl">Jobs</div>
    <div class="sb-jobs" id="sb-list"></div>
    <div class="sb-footer">
      <button class="btn-new" id="btn-new" onclick="enterCreate()">＋ Nuevo job</button>
    </div>
  </nav>
  <main class="main" id="main">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:10px">
      <div style="font-size:48px;opacity:.2">☁️</div>
      <div>Seleccioná un job o creá uno nuevo</div>
    </div>
  </main>
</div>

<div id="toasts"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let jobs = [], selected = null, logOffset = 0, logTimer = null, elapsedTimer = null;
let schedDays = new Set([1,2,3,4,5]), schedTimes = [], schedEnabled = true;
let createFile = null; // file selected for new job

const DAY_NAMES = ['D','L','M','X','J','V','S'];
const DAY_FULL  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

// ── Cron utils ────────────────────────────────────────────────────────────────
function parseCronField(f, lo, hi) {
  if (f === '*') { const r=[]; for(let i=lo;i<=hi;i++)r.push(i); return r; }
  if (f.includes('/')) { const [b,s]=f.split('/'),r=[],st=b==='*'?lo:+b; for(let i=st;i<=hi;i+=+s)r.push(i); return r; }
  if (f.includes(',')) return f.split(',').map(Number);
  if (f.includes('-')) { const [a,b]=f.split('-').map(Number),r=[]; for(let i=a;i<=b;i++)r.push(i); return r; }
  return [+f];
}

function parseCronToUI(expr) {
  if (!expr || !expr.trim()) return { days: new Set([1,2,3,4,5]), times: [] };
  const p = expr.trim().split(/\s+/);
  if (p.length !== 5) return { days: new Set([1,2,3,4,5]), times: [] };
  const [min, hour, , , dow] = p;
  const hours = parseCronField(hour, 0, 23);
  const days  = dow === '*' ? new Set([0,1,2,3,4,5,6]) : new Set(parseCronField(dow, 0, 6));
  const minVal = isNaN(+min) ? 0 : +min;
  const times = hours.sort((a,b)=>a-b).map(h => `${String(h).padStart(2,'0')}:${String(minVal).padStart(2,'0')}`);
  return { days, times };
}

function buildCron() {
  if (schedTimes.length === 0 || schedDays.size === 0) return '';
  const hours = schedTimes.map(t => +t.split(':')[0]).sort((a,b)=>a-b);
  const minVal = +schedTimes[0].split(':')[1] || 0;
  const dowStr = schedDays.size === 7 ? '*' : [...schedDays].sort((a,b)=>a-b).join(',');
  return `${minVal} ${hours.join(',')} * * ${dowStr}`;
}

function describeSchedule() {
  if (schedTimes.length === 0) return 'Sin horario automático. Solo ejecución manual.';
  if (schedDays.size === 0)    return 'Seleccioná al menos un día.';
  const days = [...schedDays].sort((a,b)=>a-b);
  const isLV   = schedDays.size===5 && [1,2,3,4,5].every(d=>schedDays.has(d));
  const isTodo = schedDays.size===7;
  const isFinde= schedDays.size===2 && schedDays.has(0) && schedDays.has(6);
  const dayStr = isLV ? 'lunes a viernes' : isTodo ? 'todos los días' : isFinde ? 'sábados y domingos' : days.map(d=>DAY_FULL[d]).join(', ');
  const tl = schedTimes.sort();
  const timeStr = tl.length===1 ? `a las ${tl[0]}` : 'a las '+tl.slice(0,-1).join(', ')+' y '+tl.at(-1);
  return `Se ejecutará ${dayStr}, ${timeStr}.`;
}

function nextRunFromCron(expr) {
  if (!expr || !expr.trim()) return null;
  const p = expr.trim().split(/\s+/);
  if (p.length !== 5) return null;
  const [mp, hp, , , dp] = p;
  const mins = parseCronField(mp, 0, 59), hrs = parseCronField(hp, 0, 23), dows = parseCronField(dp, 0, 6);
  const candidate = new Date(Date.now() + 60000); candidate.setSeconds(0,0);
  for (let i=0; i<7*24*60; i++) {
    const t = new Date(candidate.getTime() + i*60000);
    const l = new Date(t.toLocaleString('en-US', {timeZone:'America/Santiago'}));
    if (dows.includes(l.getDay()) && hrs.includes(l.getHours()) && mins.includes(l.getMinutes())) return t;
  }
  return null;
}

function fmtNextRun(dt) {
  if (!dt) return null;
  const l = new Date(dt.toLocaleString('en-US', {timeZone:'America/Santiago'}));
  const h = Math.floor((dt-Date.now())/3600000), m = Math.floor(((dt-Date.now())%3600000)/60000);
  return `${DAY_FULL[l.getDay()]} ${l.getDate()}/${l.getMonth()+1} a las ${String(l.getHours()).padStart(2,'0')}:${String(l.getMinutes()).padStart(2,'0')} (${h>0?`en ${h}h ${m}m`:`en ${m}m`})`;
}

function fmtDur(s) { return (!s&&s!==0)?'':s<60?`${s}s`:`${Math.floor(s/60)}m ${s%60}s`; }
function fmtTime(iso) { if (!iso) return '—'; return new Date(iso).toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}); }
function statusLabel(s) { return {idle:'Listo',running:'Corriendo...',success:'OK ✓',error:'Error ✗'}[s]||s; }
function resultColor(r) { if(!r) return 'var(--text2)'; return (r.includes('Error')||r.includes('❌'))?'var(--red)':'var(--green)'; }

// ── Sidebar ───────────────────────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('sb-list');
  list.innerHTML = '';
  jobs.forEach(job => {
    const el = document.createElement('div');
    el.className = 'job-item' + (job.id===selected ? ' active' : '');
    el.id = 'si-'+job.id;
    el.onclick = () => selectJob(job.id);
    const ui = parseCronToUI(job.cron);
    const timesStr = ui.times.length ? ui.times.join(', ') : 'manual';
    el.innerHTML = `
      <div class="dot ${job.status}" id="dot-${job.id}"></div>
      <div class="job-item-info">
        <div class="job-item-name">${job.name}</div>
        <div class="job-item-sub">${timesStr}</div>
      </div>`;
    list.appendChild(el);
  });
  const nb = document.getElementById('btn-new');
  if (nb) nb.classList.toggle('active', selected==='__new__');
}

function updateSidebar() {
  jobs.forEach(job => {
    const dot = document.getElementById('dot-'+job.id);
    if (dot) dot.className = 'dot '+job.status;
  });
}

// ── Select job ────────────────────────────────────────────────────────────────
function selectJob(id) {
  selected = id;
  logOffset = 0;
  clearInterval(logTimer);
  clearInterval(elapsedTimer);

  const job = jobs.find(j => j.id===id);
  if (job) {
    const ui = parseCronToUI(job.cron);
    schedDays = ui.days; schedTimes = ui.times; schedEnabled = job.enabled;
    _notifyOn = job.notify?.on || 'never';
  }

  document.querySelectorAll('.job-item').forEach(el => el.classList.remove('active'));
  const si = document.getElementById('si-'+id);
  if (si) si.classList.add('active');
  const nb = document.getElementById('btn-new');
  if (nb) nb.classList.remove('active');

  renderMain();
  logTimer = setInterval(() => pollLogs(id), 2000);
  pollLogs(id);
}

// ── Enter create ──────────────────────────────────────────────────────────────
function enterCreate() {
  selected = '__new__';
  createFile = null;
  schedDays = new Set([1,2,3,4,5]);
  schedTimes = [];
  schedEnabled = true;
  clearInterval(logTimer);
  clearInterval(elapsedTimer);

  document.querySelectorAll('.job-item').forEach(el => el.classList.remove('active'));
  document.getElementById('btn-new').classList.add('active');

  renderCreate();
}

// ── Render main (existing job) ────────────────────────────────────────────────

  const cronExpr = buildCron();
  const nextRun  = nextRunFromCron(cronExpr);
  const summary  = describeSchedule();
  const nextStr  = nextRun ? fmtNextRun(nextRun) : null;

  const histHTML = buildHistHTML(job);

  document.getElementById('main').innerHTML = `
    <div class="two-col">

      <!-- Izquierda: info + programación -->
      <div class="card">
        <div class="card-hdr" id="job-info-hdr">
          <div style="flex:1;min-width:0">

            <div style="font-size:12px;color:var(--text2);margin-top:2px" id="job-desc-txt">${job.description||'Sin descripción'}</div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;flex-shrink:0;margin-left:12px">
            <span class="status-pill ${job.status}" id="m-badge">${statusLabel(job.status)}</span>
            <button class="btn-edit" onclick="editJobInfo('${job.id}')" title="Editar nombre">✏</button>
            <button class="btn-danger" style="padding:4px 10px;font-size:11px" onclick="confirmDelete('${job.id}','${job.name.replace(/'/g,"\\'")}')">🗑</button>
          </div>
        </div>
        <div style="padding:10px 18px;border-bottom:1px solid var(--s3);display:flex;gap:20px;flex-wrap:wrap">
          <span class="meta-item">Última: <strong id="m-lastrun">${job.lastRun?fmtTime(job.lastRun):'Nunca'}</strong></span>
          <span class="meta-item" id="m-result" style="color:${resultColor(job.lastResult)}">${job.lastResult||''}</span>
          <span class="meta-item" id="m-dur">${job.lastDuration!=null?'⏱ '+fmtDur(job.lastDuration):''}</span>
        </div>
        <div class="card-body">
          ${schedPickerHTML()}
          ${notifyHTML(job)}
          <div class="btn-row">
            <button class="btn btn-primary" id="btn-save" onclick="saveSchedule('${job.id}')">💾 Guardar</button>
            <span class="save-msg" id="save-msg"></span>
          </div>
          <details class="cron-detail">
            <summary>Ver expresión técnica</summary>
            <span class="cron-code" id="cron-code">${cronExpr||'(sin programación)'}</span>
          </details>
        </div>
      </div>

      <!-- Derecha: ejecución (fija) -->
      <div class="exec-col">
        <div class="card exec-card">
          <div class="card-hdr"><span class="card-title">▶ Ejecución</span></div>
          <div class="card-body exec-body" style="padding-bottom:14px">
            <div class="exec-top">
              <button class="btn btn-green" id="btn-run" onclick="triggerRun('${job.id}')" ${job.status==='running'?'disabled':''}>▶ Ejecutar ahora</button>
              <button class="btn btn-ghost" onclick="clearLogs()">🗑 Limpiar</button>
              <button class="btn btn-danger" id="btn-stop" onclick="stopRun('${job.id}')" style="display:${job.status==='running'?'inline-flex':'none'}">⏹ Detener</button>
              <span class="exec-timer" id="exec-timer">0s</span>
              <span class="exec-status" id="exec-status"></span>
            </div>
            <div class="history-hdr">
              <span class="section-lbl">Historial</span>
              <button class="btn-clear-err" onclick="clearErrors('${job.id}')">✕ Limpiar errores</button>
            </div>
            <div class="history-list" id="history-list">${histHTML}</div>
            <div class="log-box exec-log" id="log-box"><pre id="log-pre" class="log-ph">Sin logs aún.</pre></div>

  const summary  = describeSchedule();
  const nextRun  = nextRunFromCron(cronExpr);
  const nextStr  = nextRun ? fmtNextRun(nextRun) : null;

  document.getElementById('main').innerHTML = `
    <div class="card">
      <div class="card-hdr"><span class="card-title">＋ Nuevo job</span></div>
      <div class="card-body">

          <label class="form-lbl">Nombre del job</label>

          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="btn-create" onclick="createJob()">✓ Crear job</button>
          <button class="btn btn-ghost" onclick="cancelCreate()">Cancelar</button>

// ── Schedule picker HTML (shared) ─────────────────────────────────────────────
function schedPickerHTML() {
  const cronExpr = buildCron();
  const nextRun  = nextRunFromCron(cronExpr);
  const nextStr  = nextRun ? fmtNextRun(nextRun) : null;
  const summary  = describeSchedule();

  return `
    <div class="section-lbl">¿Qué días?</div>
    <div class="day-picker" id="day-picker">
      ${[1,2,3,4,5,6,0].map(d=>`
        <button class="day-btn${schedDays.has(d)?' on':''}" data-day="${d}" onclick="toggleDay(${d})">
          ${DAY_NAMES[d]}
        </button>`).join('')}
    </div>
    <div class="day-quick">
      <span class="day-quick-btn" onclick="setDays([1,2,3,4,5])">Lunes a viernes</span>
      <span class="day-quick-btn" onclick="setDays([0,1,2,3,4,5,6])">Todos los días</span>
      <span class="day-quick-btn" onclick="setDays([6,0])">Fines de semana</span>
    </div>
    <div class="section-lbl">¿A qué horas?</div>
    <div class="time-tags" id="time-tags">${renderTimeTags()}</div>
    <div class="time-add-row">
      <input type="time" id="time-in" class="time-input" value="08:00">
      <button class="btn btn-ghost" onclick="addTime()">+ Agregar hora</button>
    </div>
    <div class="sched-summary" id="sched-summary">
      ${summary}
      ${nextStr ? `<div class="next-run">⏰ Próxima: ${nextStr}</div>` : ''}
    </div>
    <div class="manual-toggle">
      <label class="switch">
        <input type="checkbox" id="enabled-chk" ${schedEnabled?'checked':''} onchange="onToggle()">
        <div class="switch-track"></div>
        <div class="switch-thumb"></div>
      </label>
      <span class="switch-lbl" id="toggle-lbl" onclick="document.getElementById('enabled-chk').click();event.preventDefault()">
        ${schedEnabled ? 'Habilitado — corre automáticamente' : 'Deshabilitado — solo manual'}
      </span>
    </div>
  `;
}

function renderTimeTags() {
  if (schedTimes.length===0) return `<span class="time-tags-empty">Sin horarios — solo manual</span>`;
  return schedTimes.sort().map(t=>`
    <div class="time-tag">${t}<span class="time-tag-remove" onclick="removeTime('${t}')">×</span></div>`).join('');
}

// ── Day/time controls ─────────────────────────────────────────────────────────
function toggleDay(day) {
  if (schedDays.has(day)) schedDays.delete(day); else schedDays.add(day);
  document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('on', schedDays.has(+b.dataset.day)));
  refreshSummary();
}
function setDays(days) {
  schedDays = new Set(days);
  document.querySelectorAll('.day-btn').forEach(b => b.classList.toggle('on', schedDays.has(+b.dataset.day)));
  refreshSummary();
}
function addTime() {
  const v = document.getElementById('time-in')?.value;
  if (!v) return;
  if (!schedTimes.includes(v)) { schedTimes.push(v); schedTimes.sort(); }
  document.getElementById('time-tags').innerHTML = renderTimeTags();
  refreshSummary();
}
function removeTime(t) {
  schedTimes = schedTimes.filter(x=>x!==t);
  document.getElementById('time-tags').innerHTML = renderTimeTags();
  refreshSummary();
}
function onToggle() {
  schedEnabled = document.getElementById('enabled-chk').checked;
  const lbl = document.getElementById('toggle-lbl');
  if (lbl) lbl.textContent = schedEnabled ? 'Habilitado — corre automáticamente' : 'Deshabilitado — solo manual';
}
function refreshSummary() {
  const cronExpr = buildCron();
  const nextRun  = nextRunFromCron(cronExpr);
  const el = document.getElementById('sched-summary');
  if (el) el.innerHTML = describeSchedule() + (nextRun ? `<div class="next-run">⏰ Próxima: ${fmtNextRun(nextRun)}</div>` : '');
  const code = document.getElementById('cron-code');
  if (code) code.textContent = cronExpr || '(sin programación)';
}

// ── File upload (drag&drop) ───────────────────────────────────────────────────
function onFileSelect(e) { setFile(e.target.files[0]); }
function onDragOver(e)   { e.preventDefault(); document.getElementById('file-drop').classList.add('over'); }
function onDragLeave(e)  { document.getElementById('file-drop').classList.remove('over'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('file-drop').classList.remove('over');
  setFile(e.dataTransfer.files[0]);
}
function setFile(f) {
  if (!f) return;
  if (!/\.(js|py)$/.test(f.name)) { toast('Solo se aceptan archivos .js o .py', 'err'); return; }
  createFile = f;
  const nameEl = document.getElementById('file-name');
  if (nameEl) { nameEl.style.display='block'; nameEl.textContent = '📄 '+f.name; }
  // populate job name if empty
  const nameIn = document.getElementById('new-name');
  if (nameIn && !nameIn.value) nameIn.value = f.name.replace(/\.(js|py)$/, '').replace(/[-_]/g,' ');
}

// ── Create job ────────────────────────────────────────────────────────────────
async function createJob() {
  const name = document.getElementById('new-name')?.value?.trim();
  const desc = document.getElementById('new-desc')?.value?.trim() || '';
  if (!name) { toast('Ingresá un nombre para el job', 'err'); return; }
  if (!createFile) { toast('Seleccioná un archivo .js o .py', 'err'); return; }

  const btn = document.getElementById('btn-create');
  const msg = document.getElementById('save-msg');
  if (btn) btn.disabled = true;
  if (msg) msg.textContent = 'Subiendo script...';

  // 1. Upload file
  const fd = new FormData();
  fd.append('file', createFile);
  let filename;
  try {
    const r = await fetch('/api/scripts/upload', { method:'POST', body: fd });
    const d = await r.json();
    if (!r.ok || d.error) { toast(d.error||'Error al subir archivo', 'err'); if(btn)btn.disabled=false; if(msg)msg.textContent=''; return; }
    filename = d.filename;
  } catch { toast('Error de conexión al subir', 'err'); if(btn)btn.disabled=false; if(msg)msg.textContent=''; return; }

  // 2. Create job
  if (msg) msg.textContent = 'Creando job...';
  try {
    const r = await fetch('/api/jobs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, description: desc, script: filename, cron: buildCron(), enabled: schedEnabled }),
    });
    const d = await r.json();
    if (!r.ok || d.error) { toast(d.error||'Error al crear job', 'err'); if(btn)btn.disabled=false; if(msg)msg.textContent=''; return; }

    toast(`Job "${name}" creado ✓`, 'ok');
    // Refresh and select new job
    jobs = await fetch('/api/jobs').then(r=>r.json());
    renderSidebar();
    if (d.id) selectJob(d.id);
  } catch { toast('Error de conexión', 'err'); if(btn)btn.disabled=false; if(msg)msg.textContent=''; }
}

function cancelCreate() {
  selected = null;
  document.querySelectorAll('.job-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('btn-new').classList.remove('active');
  document.getElementById('main').innerHTML = `
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text2);gap:10px">
      <div style="font-size:48px;opacity:.2">☁️</div>
      <div>Seleccioná un job o creá uno nuevo</div>
    </div>`;
}

// ── Delete job ────────────────────────────────────────────────────────────────
function confirmDelete(id, name) {
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `
    <div class="modal">
      <h3>¿Eliminar job?</h3>
      <p>Vas a eliminar <strong>${name}</strong>. Esta acción no se puede deshacer.</p>
      <div class="modal-btns">
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
        <button class="btn" style="background:#da3633;border-color:#da3633;color:#fff" onclick="deleteJob('${id}');this.closest('.modal-overlay').remove()">Eliminar</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}

async function deleteJob(id) {
  const r = await fetch(`/api/jobs/${id}`, { method:'DELETE' });
  const d = await r.json();
  if (d.ok) {
    toast('Job eliminado', 'ok');
    jobs = jobs.filter(j=>j.id!==id);
    selected = null;
    clearInterval(logTimer);
    renderSidebar();
    cancelCreate();
  } else toast(d.error||'Error al eliminar', 'err');
}

// ── Save schedule (existing job) ──────────────────────────────────────────────
async function saveSchedule(id) {
  const btn = document.getElementById('btn-save');
  const msg = document.getElementById('save-msg');
  if (btn) btn.disabled = true;
  if (msg) msg.textContent = 'Guardando...';
  try {
    const r = await fetch(`/api/jobs/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cron: buildCron(), enabled: document.getElementById('enabled-chk')?.checked ?? true, notify: getNotifyConfig() }),
    });
    const d = await r.json();
    if (d.ok) {
      toast('Programación guardada ✓', 'ok');
      const job = jobs.find(j=>j.id===id);
      if (job) { job.cron = buildCron(); job.enabled = schedEnabled; }
      updateSidebar();
    } else toast(d.error||'Error al guardar', 'err');
  } catch { toast('Error de conexión', 'err'); }
  finally { if(btn)btn.disabled=false; if(msg)msg.textContent=''; }
}

// ── Run ───────────────────────────────────────────────────────────────────────
async function triggerRun(id) {
  const btn = document.getElementById('btn-run');
  if (btn) btn.disabled = true;
  const r = await fetch(`/api/jobs/${id}/run`, { method:'POST' });
  const d = await r.json();
  if (d.error) { toast(d.error, 'err'); if(btn)btn.disabled=false; }
  else { logOffset=0; const pre=document.getElementById('log-pre'); if(pre){pre.textContent='';pre.className='';} startElapsedTimer(new Date()); toast('Ejecución iniciada','ok'); }
}
function clearLogs() { const pre=document.getElementById('log-pre'); if(pre){pre.textContent='Logs limpiados.';pre.className='log-ph';} logOffset=0; }

async function stopRun(id) {
  const btn = document.getElementById('btn-stop');
  if (btn) { btn.disabled = true; btn.textContent = '⏹ Deteniendo...'; }
  try {
    const r = await fetch(`/api/jobs/${id}/stop`, { method:'POST' });
    const d = await r.json();
    if (d.error) toast(d.error, 'err');
    else toast('Ejecución detenida', 'ok');
  } catch { toast('Error al detener', 'err'); }
  finally { if(btn) { btn.disabled=false; btn.textContent='⏹ Detener'; } }
}

// ── Elapsed ───────────────────────────────────────────────────────────────────
function startElapsedTimer(startDate) {
  clearInterval(elapsedTimer);
  const el = document.getElementById('exec-timer');
  if (el) el.classList.add('visible');
  elapsedTimer = setInterval(() => {
    const el = document.getElementById('exec-timer');
    if (!el) { clearInterval(elapsedTimer); return; }
    el.textContent = fmtDur(Math.round((Date.now()-startDate)/1000));
  }, 1000);
}
function stopElapsedTimer() {
  clearInterval(elapsedTimer); elapsedTimer=null;
  const el = document.getElementById('exec-timer');
  if (el) el.classList.remove('visible');
}

// ── Notifications ─────────────────────────────────────────────────────────────
function notifyHTML(job) {
  const n = job.notify || { on: 'never', email: '' };
  const opts = [
    { v: 'never',   label: '🔕 Nunca' },
    { v: 'failure', label: '❌ Solo errores' },
    { v: 'success', label: '✅ Solo éxitos' },
    { v: 'always',  label: '🔔 Siempre' },
  ];
  const pills = opts.map(o => `
    <button class="notify-pill ${n.on===o.v?'active-'+o.v:''}" onclick="setNotify('${o.v}')">${o.label}</button>`).join('');
  const emailRow = n.on !== 'never' ? `
    <div class="notify-email-row">
      <input class="notify-email-inp" id="notify-email" type="email" value="${n.email||''}" placeholder="destino@email.com">
    </div>` : '';
  return `
    <div class="notify-section">
      <div class="section-lbl">🔔 Notificaciones por email</div>
      <div class="notify-pills" id="notify-pills">${pills}</div>
      <div id="notify-email-row">${emailRow}</div>
    </div>`;
}

let _notifyOn = 'never';
function setNotify(val) {
  _notifyOn = val;
  const opts = [
    { v: 'never',   label: '🔕 Nunca' },
    { v: 'failure', label: '❌ Solo errores' },
    { v: 'success', label: '✅ Solo éxitos' },
    { v: 'always',  label: '🔔 Siempre' },
  ];
  const pills = document.getElementById('notify-pills');
  if (pills) pills.innerHTML = opts.map(o => `
    <button class="notify-pill ${val===o.v?'active-'+o.v:''}" onclick="setNotify('${o.v}')">${o.label}</button>`).join('');
  const row = document.getElementById('notify-email-row');
  if (row) {
    const cur = document.getElementById('notify-email')?.value || '';
    row.innerHTML = val !== 'never' ? `
      <div class="notify-email-row">
        <input class="notify-email-inp" id="notify-email" type="email" value="${cur}" placeholder="destino@email.com">
      </div>` : '';
  }
}

function getNotifyConfig() {
  return { on: _notifyOn, email: document.getElementById('notify-email')?.value?.trim() || '' };
}

// ── Inline edit job info ──────────────────────────────────────────────────────
function editJobInfo(id) {
  const job = jobs.find(j => j.id === id);
  if (!job) return;
  const hdr = document.getElementById('job-info-hdr');
  if (!hdr) return;
  hdr.innerHTML = `
    <div class="edit-wrap">
      <input class="edit-inp" id="ei-name" value="${job.name}" placeholder="Nombre del job">
      <input class="edit-inp sm" id="ei-desc" value="${job.description||''}" placeholder="Descripción (opcional)">
      <div style="display:flex;gap:8px;margin-top:2px">
        <button class="btn btn-primary" style="padding:5px 14px;font-size:12px" onclick="saveJobInfo('${id}')">✓ Guardar</button>
        <button class="btn btn-ghost" style="padding:5px 12px;font-size:12px" onclick="selectJob('${id}')">Cancelar</button>
      </div>
    </div>`;
  document.getElementById('ei-name')?.focus();
}

async function saveJobInfo(id) {
  const name = document.getElementById('ei-name')?.value?.trim();
  const desc = document.getElementById('ei-desc')?.value?.trim() || '';
  if (!name) { toast('El nombre no puede estar vacío', 'err'); return; }
  const r = await fetch(`/api/jobs/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, description: desc }),
  });
  const d = await r.json();
  if (d.ok) {
    const job = jobs.find(j => j.id === id);
    if (job) { job.name = name; job.description = desc; }
    toast('Guardado ✓', 'ok');
    renderSidebar();
    selectJob(id);
  } else toast(d.error || 'Error al guardar', 'err');
}

// ── History helpers ───────────────────────────────────────────────────────────
function buildHistHTML(job) {
  if (!job.history || !job.history.length)
    return `<div class="history-empty">Sin ejecuciones previas.</div>`;
  return job.history.map((h, i) => `
    <div class="history-row" id="hrow-${i}">
      <div class="history-dot ${h.status}"></div>
      <div class="h-time">${fmtTime(h.startTime)}</div>
      <div class="h-result" style="color:${h.status==='error'?'var(--red)':'var(--text)'}">${h.result||h.status}</div>
      <div class="h-dur">${fmtDur(h.duration)}</div>
      <span class="h-del" title="Eliminar" onclick="deleteHistEntry('${job.id}',${i})">×</span>
    </div>`).join('');
}

async function deleteHistEntry(jobId, idx) {
  await fetch(`/api/jobs/${jobId}/history?idx=${idx}`, { method: 'DELETE' });
  const job = jobs.find(j => j.id === jobId);
  if (job) job.history.splice(idx, 1);
  const list = document.getElementById('history-list');
  if (list && job) list.innerHTML = buildHistHTML(job);
}

async function clearErrors(jobId) {
  const job = jobs.find(j => j.id === jobId);
  if (!job) return;
  // Remove errors locally and send individual deletes (reverse order to keep indices valid)
  const errorIdxs = job.history.map((h,i) => h.status==='error' ? i : -1).filter(i=>i>=0).reverse();
  for (const idx of errorIdxs) {
    await fetch(`/api/jobs/${jobId}/history?idx=${idx}`, { method: 'DELETE' });
    job.history.splice(idx, 1);
  }
  const list = document.getElementById('history-list');
  if (list) list.innerHTML = buildHistHTML(job);
  if (errorIdxs.length) toast(`${errorIdxs.length} error(es) eliminado(s)`, 'ok');
}

// ── Poll logs ─────────────────────────────────────────────────────────────────
async function pollLogs(id) {
  if (id!==selected) return;
  try {
    const r = await fetch(`/api/jobs/${id}/logs?offset=${logOffset}`);
    const d = await r.json();
    const lbl = document.getElementById('exec-status');
    if (lbl) { const labels={idle:'—',running:'⏳ Corriendo...',success:'✅ Completado',error:'❌ Error'}; lbl.textContent=labels[d.status]||''; lbl.style.color=d.status==='error'?'var(--red)':d.status==='success'?'var(--green)':'var(--text2)'; }
    if (d.logs&&d.logs.length) {
      const pre=document.getElementById('log-pre');
      if (pre) { if(pre.classList.contains('log-ph')){pre.className='';pre.textContent='';} pre.textContent+=d.logs.join('\n')+'\n'; logOffset+=d.logs.length; const box=document.getElementById('log-box'); if(box)box.scrollTop=box.scrollHeight; }
    }
  } catch {}
}

// ── Poll jobs ─────────────────────────────────────────────────────────────────
async function pollJobs() {
  try {
    const updated = await fetch('/api/jobs').then(r=>r.json());
    let needsRerender = false;
    updated.forEach(u => {
      const j = jobs.find(j=>j.id===u.id);
      if (j) { const wasRunning=j.status==='running'; Object.assign(j,u); if(wasRunning&&u.status!=='running')needsRerender=true; }
      else jobs.push(u);
    });
    updateSidebar();
    if (!selected || selected==='__new__') return;
    const job = jobs.find(j=>j.id===selected);
    if (!job) return;
    const badge=document.getElementById('m-badge'); if(badge){badge.className='status-pill '+job.status;badge.textContent=statusLabel(job.status);}
    const lr=document.getElementById('m-lastrun'); if(lr)lr.textContent=job.lastRun?fmtTime(job.lastRun):'Nunca';
    const res=document.getElementById('m-result'); if(res){res.textContent=job.lastResult||'';res.style.color=resultColor(job.lastResult);}
    const dur=document.getElementById('m-dur'); if(dur)dur.textContent=job.lastDuration!=null?'⏱ '+fmtDur(job.lastDuration):'';
    const runBtn=document.getElementById('btn-run'); if(runBtn)runBtn.disabled=job.status==='running';
    const stopBtn=document.getElementById('btn-stop'); if(stopBtn)stopBtn.style.display=job.status==='running'?'inline-flex':'none';
    if(job.status==='running'&&!elapsedTimer&&job.runStart)startElapsedTimer(new Date(job.runStart));
    else if(job.status!=='running'&&elapsedTimer)stopElapsedTimer();
    if(needsRerender){ renderMain(); logOffset = 0; pollLogs(selected); return; }
    // Refresh history list without full rerender
    const hl = document.getElementById('history-list');
    if (hl) hl.innerHTML = buildHistHTML(job);
  } catch {}
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el=document.createElement('div'); el.className=`toast ${type}`;
  el.textContent=(type==='ok'?'✅ ':'❌ ')+msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}

// ── Clock ─────────────────────────────────────────────────────────────────────
setInterval(()=>{ const el=document.getElementById('clock'); if(el)el.textContent=new Date().toLocaleTimeString('es-CL',{timeZone:'America/Santiago'}); }, 1000);

// ── Init ──────────────────────────────────────────────────────────────────────
(async function init() {
  jobs = await fetch('/api/jobs').then(r=>r.json());
  renderSidebar();
  if (jobs.length===1) selectJob(jobs[0].id);
  setInterval(pollJobs, 3000);
})();
</script>
</body>
